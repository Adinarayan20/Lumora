name: Continuous Integration & Release Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  DATABASE_URL: "postgresql://lumora_test:lumora_password@localhost:5432/lumora_test_db?schema=public"
  POSTGRES_INTEGRATION_TEST: "true"
  REDIS_URL: "redis://localhost:6379"

jobs:
  quality-gates:
    name: Run Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumora_test
          POSTGRES_PASSWORD: lumora_password
          POSTGRES_DB: lumora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic Prisma Client Generation
        run: pnpm run prisma:generate

      - name: Validate Prisma Schema
        run: pnpm --filter @lumora/backend prisma validate

      - name: Deploy Prisma Migrations to Test Database
        run: pnpm --filter @lumora/backend prisma migrate deploy

      - name: 1. Typecheck Monorepo
        run: pnpm run typecheck

      - name: 2. Lint Source Code
        run: pnpm run lint

      - name: 3. Run Unit & Real PostgreSQL Integration Tests
        run: pnpm run test

      - name: 4. Build Monorepo Bundles
        run: pnpm run build

      - name: Upload Build & Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            apps/backend/coverage/
            apps/backend/*.log
            .turbo/
          retention-days: 7
