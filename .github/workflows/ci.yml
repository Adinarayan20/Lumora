name: Continuous Integration & Release Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: true
  # NOTE: Local mock placeholders for unit test execution.
  # FUTURE MIGRATION PATH: When live E2E integration test suites are added in future phases,
  # replace these placeholders with GitHub Service Containers (e.g. services.postgres, services.redis)
  # or GitHub Secrets for external staging environments.
  DATABASE_URL: "postgresql://lumora:lumora@localhost:5432/lumora_test?schema=public"
  REDIS_URL: "redis://localhost:6379"

jobs:
  quality-gates:
    name: Run Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Deterministic Prisma Client Generation
        run: pnpm run prisma:generate

      - name: 1. Typecheck Monorepo
        run: pnpm run typecheck

      - name: 2. Lint Source Code
        run: pnpm run lint

      - name: 3. Run Unit Tests
        run: pnpm run test

      - name: 4. Build Monorepo Bundles
        run: pnpm run build

      - name: Upload Build & Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            apps/backend/coverage/
            apps/backend/*.log
            .turbo/
          retention-days: 7
