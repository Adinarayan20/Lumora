packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - "@firebase/util"
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "@swc/core"
  - "bcrypt"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "protobufjs"
  - "unrs-resolver"
allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  'unrs-resolver': true
